name: Deploy API to VPS

on:
  push:
    branches: [ main ]  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (para ler arquivos do repo)
        uses: actions/checkout@v4

      - name: SSH into VPS and deploy API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}  
          key: ${{ secrets.SSH_KEY }}         
          port: ${{ secrets.SSH_PORT }}
          script_stop: false
          envs: GH_PAT
          script: |
            set -e

            # === Ajuste aqui o caminho da API na VPS ===
            APP_DIR="/home/deploy/apps/coffe_cake_backend"
            APP_PARENT_DIR="$(dirname "$APP_DIR")"
            APP_FOLDER_NAME="$(basename "$APP_DIR")"

            # === Ajuste aqui o nome do repositório do backend no GitHub ===
            REPO_URL="https://$GH_PAT@github.com/arleynm/coffe_cake_backend.git"

            # A pasta pertence ao usuário 'deploy'; o deploy pode rodar como outro
            # usuário (ex.: root). Marca o dir como seguro p/ evitar "dubious ownership".
            git config --global --add safe.directory "$APP_DIR" || true

            echo "Verificando se o diretório $APP_DIR existe..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Primeira vez? Clonando repo da API em $APP_DIR ..."
              mkdir -p "$APP_PARENT_DIR"
              cd "$APP_PARENT_DIR"
              git clone "$REPO_URL" "$APP_FOLDER_NAME"
              cd "$APP_DIR"
            else
              echo "Diretório da API existe. Atualizando código..."
              cd "$APP_DIR"

              echo "Configurando remote 'origin'..."
              if git remote get-url origin >/dev/null 2>&1; then
                echo "Remote 'origin' já existe. Atualizando URL..."
                git remote set-url origin "$REPO_URL"
              else
                echo "Remote 'origin' não existe. Criando..."
                git remote add origin "$REPO_URL"
              fi

              echo "Buscando alterações..."
              git fetch --all
              git reset --hard origin/main
            fi


            echo "Checando se Node.js está instalado..."
            if ! command -v node >/dev/null 2>&1; then
              echo "Node não encontrado. Instalando Node.js 20.x..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs
            fi

            echo "Node e npm versões:"
            node -v
            npm -v

            echo "Instalando dependências (para prisma CLI + testes)..."
            cd "$APP_DIR"
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            echo "Gerando client do Prisma (necessário para compilar os testes)..."
            npx prisma generate

            echo "Rodando testes automatizados (barra o deploy se falhar)..."
            npm test

            # Sincroniza o schema com o banco de forma ADITIVA e SEGURA.
            # SEM --accept-data-loss de propósito: aplica colunas/tabelas novas
            # preservando os dados; se detectar qualquer mudança destrutiva,
            # o comando PARA sozinho (nunca apaga dados de produção).
            echo "Aplicando schema no banco (aditivo, sem apagar dados)..."
            npx prisma db push

            # A produção roda em container Docker (clean_api), servido pelo Caddy.
            # Rebuildamos o container com o código novo — é o que atualiza a API.
            echo "Rebuildando o container da API (Docker)..."
            docker compose up -d --build api

            echo "Limpando imagens antigas..."
            docker image prune -f || true

            echo "Status:"
            docker compose ps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
